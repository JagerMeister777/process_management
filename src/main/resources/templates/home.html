<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head :: commonHead(~{::title})}">
  <meta charset="UTF-8">
  <title>トップページ</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="header">
  <div th:replace="~{fragments/navbar :: navbar}"></div>
</header>

<div style="height: 100vh;" class="container-fluid">
  <div class="row h-100">
    <!-- サイドバー -->
    <div class="col-3 border border-dark sidebar" id="sidebar">
      <div class="row">
        <div class="col-11">
          <div class="row">
            <div class="col">
              <div class="d-flex justify-content-between mt-3 mb-3">
                <h5 class="d-inline mt-2">プロジェクト一覧</h5>
                <a class="btn btn-primary" th:href="@{/projects/{userId}/create(userId=${userId})}">新規作成</a>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col">
              <ul class="list-group" style="max-height: 300px; overflow-y: auto;">
                <li class="list-group-item" th:each="project : ${projectsList}">
                  <a th:href="@{/users/{userId}/projects/{projectId}(projectId=${project.id},userId=${userId})}"
                     th:text="${project.name}"></a>
                </li>
              </ul>
            </div>
          </div>
          <div class="row mt-3 mb-3">
            <div class="col">
              <h5 class="mt-3 mb-3">プロジェクトの詳細</h5>
              <div th:if="${project != null}"
                   th:replace="~{projects/detail :: detail(project=${project})}"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- メインコンテンツ -->
    <div class="col-9 border border-dark" id="main-content">
      <div class="row">
        <div class="col">
          <div class="d-flex justify-content-between mt-3 mb-3">
            <!-- サイドバー表示/非表示ボタン -->
            <button id="toggleSidebar" class="m-1 toggle-btn btn btn-secondary">≪</button>
            <h5 class="d-inline" th:text="${project.name} + 'の工程表'">
              プロジェクト名の工程表</h5>
            <a class="btn btn-primary"
               th:href="@{/users/{userId}/projects/{projectId}/task/create(userId=${userId},projectId=${project.id})}">タスクの新規作成</a>
          </div>
          <div th:replace="~{projects/chart :: chart(tasks=${taskList})}"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- サイドバーを隠したり表示したりするためのスクリプト -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
  const sidebar = document.getElementById('sidebar');
  const mainContent = document.getElementById('main-content');
  const toggleBtn = document.getElementById('toggleSidebar');
  const sidebarState = localStorage.getItem('sidebarState');

  if (sidebarState === 'hidden') {
    sidebar.classList.add('d-none');
    mainContent.classList.replace('col-9', 'col-12');
    toggleBtn.textContent = "≫";
  }

  toggleBtn.addEventListener('click', function () {
    sidebar.classList.toggle('d-none');
    if (sidebar.classList.contains('d-none')) {
      mainContent.classList.replace('col-9', 'col-12');
      localStorage.setItem('sidebarState', 'hidden');
      this.textContent = "≫";
    } else {
      mainContent.classList.replace('col-12', 'col-9');
      localStorage.setItem('sidebarState', 'visible');
      this.textContent = "≪";
    }
  });
});
</script>


<!-- Bootstrapのスクリプト -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-geWF76RCwLtnZ8qwWowPQNguL3RmwHVBC9FhGdlKrxdiJJigb/j/68SIy3Te4Bkz"
        crossorigin="anonymous"></script>
</body>
</html>
