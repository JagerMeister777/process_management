<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.w3.org/1999/xhtml" th:fragment="chart(tasks)">
<head>
  <meta charset="UTF-8">
  <title>バーチャート工程表 (Konva.js)</title>
  <script src="https://cdn.jsdelivr.net/npm/konva@8.0.0/konva.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon"></script>
  <style>
    .chart-container {
        width: 100%;
        height: 550px;
        overflow: hidden;
        display: block;
        border: 1px solid #ccc;
    }
    .axis-text {
        font-size: 12px;
        fill: black;
    }
  </style>
</head>
<body>
<div class="chart-container">
  <div id="container"></div>
</div>

<script th:inline="javascript">
  const tasks = /*[[${tasks}]]*/ [];
  console.log(tasks);
  const projectStartDate = new Date(/*[[${project.startProject}]]*/).getTime();
  const projectEndDate = new Date(/*[[${project.EndProject}]]*/).getTime();

  if (tasks.length > 0) {
      const minDate = Math.min(...tasks.map(task => new Date(task.startDate).getTime()));
      const maxDate = Math.max(...tasks.map(task => new Date(task.endDate).getTime()));
      const daysBetween = (maxDate - minDate) / (1000 * 60 * 60 * 24);

      const taskHeight = 40;
      const taskMargin = 10;
      const dayScale = 100;
      const projectDuration = projectEndDate - projectStartDate;

      document.addEventListener("DOMContentLoaded", function () {
          const stage = new Konva.Stage({
              container: 'container',
              width: window.innerWidth,
              height: 550
          });

          const layer = new Konva.Layer();
          stage.add(layer);

          const dateCount = (maxDate - minDate) / (1000 * 60 * 60 * 24);
          for (let i = 0; i <= dateCount; i++) {
              const x = (i * 100) + 50;
              const text = new Konva.Text({
                  x: x,
                  y: 20,
                  text: new Date(minDate + (i * (1000 * 60 * 60 * 24))).toLocaleDateString(),
                  fontSize: 10,
                  fontFamily: 'Arial',
                  fill: 'black',
                  offsetX: 10,
                  offsetY: 10,
              });
              layer.add(text);
          }

          tasks.forEach((task, index) => {
              const y = (index * (taskHeight + taskMargin));
              const text = new Konva.Text({
                  x: 0,
                  y: y + (taskHeight / 2) - 5 + 50,
                  text: task.name,
                  fontSize: 12,
                  fontFamily: 'Arial',
                  fill: 'black',
              });
              layer.add(text);
          });

          const yOffset = 50;

          tasks.forEach((task, index) => {
              const taskStartDate = new Date(task.startDate);
              const taskEndDate = new Date(task.endDate);
              const taskStartX = (taskStartDate - projectStartDate) / projectDuration * dayScale;
              const taskWidth = (taskEndDate - taskStartDate) / projectDuration * dayScale;

              const rect = new Konva.Rect({
                  x: taskStartX,
                  y: index * (taskHeight + taskMargin) + yOffset,
                  width: taskWidth,
                  height: taskHeight - 5,
                  fill: 'rgba(54, 162, 235, 0.5)',
                  stroke: 'rgba(54, 162, 235, 1)',
                  strokeWidth: 2,
                  cornerRadius: 5
              });

              const text = new Konva.Text({
                  x: taskStartX,
                  y: index * (taskHeight + taskMargin) + (taskHeight - 20) / 2 + yOffset,
                  text: task.name,
                  fontSize: 12,
                  fontFamily: 'Arial',
                  fill: 'black'
              });

              layer.add(rect);
              layer.add(text);
          });

          layer.batchDraw();

          // **ズームイン・ズームアウト**
          stage.on('wheel', (e) => {
              e.evt.preventDefault();

              const scaleBy = 1.1;
              const oldScale = stage.scaleX();
              const mousePoint = stage.getPointerPosition();
              const newScale = e.evt.deltaY < 0 ? oldScale * scaleBy : oldScale / scaleBy;
              const stageX = stage.x();
              const stageY = stage.y();
              const newX = mousePoint.x - (mousePoint.x - stageX) * (newScale / oldScale);
              const newY = mousePoint.y - (mousePoint.y - stageY) * (newScale / oldScale);

              stage.scale({ x: newScale, y: newScale });
              stage.position({ x: newX, y: newY });

              layer.batchDraw();
          });

          // **左クリックのドラッグで移動**
          let isDragging = false;
          let lastPos = { x: 0, y: 0 };

          stage.on('mousedown', (e) => {
              if (e.evt.button === 0) { // 左クリックのみ
                  isDragging = true;
                  lastPos = stage.getPointerPosition();
              }
          });

          stage.on('mousemove', (e) => {
              if (!isDragging) return;

              const mousePos = stage.getPointerPosition();
              const dx = mousePos.x - lastPos.x;
              const dy = mousePos.y - lastPos.y;

              stage.x(stage.x() + dx);
              stage.y(stage.y() + dy);
              lastPos = mousePos;
          });

          stage.on('mouseup', () => {
              isDragging = false;
          });

          stage.on('mouseleave', () => {
              isDragging = false;
          });

          // **ウィンドウリサイズ対応**
          window.addEventListener('resize', function () {
              stage.width(window.innerWidth);
              stage.height(window.innerHeight);
          });

          stage.add(layer);
      });
  }
</script>

</body>
</html>
